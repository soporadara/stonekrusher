<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 — Access Denied</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red: #E24B4A;
      --red-dark: #A32D2D;
      --red-light: #FCEBEB;
      --gray-900: #1a1a1a;
      --gray-800: #2a2a2a;
      --gray-600: #555;
      --gray-200: #e0e0e0;
      --gray-100: #f5f5f5;
      --mono: 'IBM Plex Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    html,
    body {
      height: 100%;
      background: #ffffff;
      color: var(--red-dark);
      font-family: var(--display);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(226, 75, 74, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(226, 75, 74, 0.08) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      animation: scanline 3s ease-in-out infinite;
      z-index: 10;
    }

    @keyframes scanline {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 2rem 5rem;
    }

    .container {
      max-width: 680px;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(32px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-code {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .error-code::before,
    .error-code::after {
      content: '';
      display: block;
      width: 40px;
      height: 0.5px;
      background: var(--red);
      opacity: 0.5;
    }

    .big-number {
      font-family: var(--display);
      font-size: clamp(6rem, 18vw, 10rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #A32D2D, #E24B4A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
      opacity: 1;
      user-select: none;
    }

    h1 {
      font-family: var(--display);
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      color: var(--red-dark);
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      line-height: 1.1;
    }

    h1 span {
      color: var(--red);
    }

    .subtext {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--red);
      line-height: 1.8;
      max-width: 480px;
      margin: 0 auto 2.5rem;
      letter-spacing: 0.01em;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--red-dark);
      letter-spacing: 0.1em;
      border-top: 0.5px solid rgba(226, 75, 74, 0.15);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
    }

    @media (max-width: 500px) {
      .footer {
        flex-direction: column;
        gap: 4px;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="topbar"></div>

  <main class="page">
    <div class="container">

      <div class="error-code">HTTP 403</div>
      <div class="big-number">403</div>

      <h1>Access <span>Denied</span></h1>

      <p class="subtext">
        You do not have permission to access this resource.<br>
        Your request has been logged and the administrator has been notified.
      </p>

    </div>
  </main>

  <footer class="footer">
    <span>© 2026 Happymachinery.com. All rights reserved.</span>
    <span>ALL UNAUTHORIZED ACCESS IS MONITORED AND PROSECUTED</span>
  </footer>

</body>

</html>
