      <h1>Privacy Policy</h1>
      <p>Last updated: October 22, 2026</p>
      <p>Your privacy matters to us. This policy explains what information KONSTRUCTZ collects on stonekrusher.com, why we collect it, and the choices you have.</p>

      <section id="scope">
        <h2>1. Who We Are and Scope</h2>
        <p>KONSTRUCTZ (&quot;we&quot;, &quot;us&quot;, &quot;our&quot;) operates stonekrusher.com (the &quot;Site&quot;). This Privacy Policy describes how we handle personal information collected through the Site, our quote and contact forms, our online store, and our communications with you. It does not apply to third-party sites we link to.</p>
      </section>

      <section id="information-we-collect">
        <h2>2. Information We Collect</h2>
        <p>We collect the following categories of information:</p>
        <ul><li>Information you give us: name, company, email address, phone number, delivery address, equipment interests, and message content when you request a quote, contact sales or support, place an order, comment on an article, or chat with our assistant.</li><li>Order and payment details: processed by our store platform and payment providers. We do not store full payment card numbers on our servers.</li><li>Technical and usage data: IP address, browser and device type, pages viewed, referring pages, and approximate location derived from IP address, collected through server logs and similar technologies.</li><li>Browser storage data: cart contents, saved inquiries, viewed items, and display preferences kept in your browser (see Cookies and Local Storage).</li><li>Staff account data: for authorized CMS users, name, email address, role, login history, and security logs, including sign-in through Google where enabled.</li></ul>
      </section>

      <section id="how-we-use">
        <h2>3. How We Use Information</h2>
        <p>We use personal information to:</p>
        <ul><li>respond to quote requests, support requests, and other inquiries;</li><li>process orders, arrange delivery, provide warranty and parts support, and handle financing questions;</li><li>operate, maintain, and improve the Site, content, and product information;</li><li>protect the Site and our users, detect fraud and abuse, and enforce our Terms of Service;</li><li>send service messages and, where permitted, marketing updates you can opt out of at any time;</li><li>comply with legal obligations and resolve disputes.</li></ul>
      </section>

      <section id="cookies">
        <h2>4. Cookies and Local Storage</h2>
        <p>We and our service providers use cookies, local storage, and similar technologies. Some are essential, such as keeping items in your cart, remembering your saved inquiries, and keeping authorized staff securely signed in to the CMS with an HttpOnly session cookie. Others help us understand how the Site is used.</p>
        <p>You can block or delete cookies and local storage in your browser settings. Some Site features may not work properly if you do.</p>
      </section>

      <section id="sharing">
        <h2>5. How We Share Information</h2>
        <p>We do not sell your personal information. We share it only as described here:</p>
        <ul><li>Service providers who help us run the Site and business, such as web hosting, our e-commerce and checkout platform (Ecwid), payment processors, email and communication tools, and freight and shipping carriers. They may use the information only to provide services to us.</li><li>Legal and safety: when required by law or legal process, or to protect the rights, property, or safety of KONSTRUCTZ, our customers, or others.</li><li>Business transfers: in connection with a merger, financing, or sale of all or part of our business.</li><li>With your direction or consent.</li></ul>
      </section>

      <section id="google">
        <h2>6. Google and Other Third-Party Services</h2>
        <p>Authorized staff may sign in to the CMS using Google Sign-In. When this is used, Google provides us with your verified email address and basic profile details so we can match you to an existing staff account. We do not receive your Google password, and we do not access your Google contacts, mail, or files. Google's own Privacy Policy governs its handling of your data.</p>
        <p>The Site may also load fonts and other resources from Google, and includes links to social networks such as TikTok, Pinterest, Tumblr, X, Facebook, and Instagram. Those services may collect information about you under their own policies when you interact with them.</p>
      </section>

      <section id="retention">
        <h2>7. Data Retention</h2>
        <p>We keep personal information only as long as needed for the purposes described in this policy, including to complete transactions, provide warranty and support, meet legal, tax, and accounting requirements, and resolve disputes. Security and audit logs for staff accounts are kept for a limited period and then deleted or anonymized.</p>
      </section>

      <section id="security">
        <h2>8. Security</h2>
        <p>We use reasonable administrative, technical, and organizational safeguards to protect personal information, including encrypted connections (HTTPS), hashed passwords, access controls, login lockouts, and audit logging for our CMS. No method of transmission or storage is completely secure, so we cannot guarantee absolute security.</p>
      </section>

      <section id="your-choices">
        <h2>9. Your Choices and Rights</h2>
        <p>You may contact us at any time to request access to, correction of, or deletion of the personal information we hold about you, or to opt out of marketing emails. You can also unsubscribe using the link in any marketing email. We may need to verify your identity before acting on a request, and we may retain information we are required or permitted by law to keep.</p>
      </section>

      <section id="california">
        <h2>10. California Privacy Rights</h2>
        <p>If you are a California resident, the California Consumer Privacy Act (as amended by the CPRA) gives you the right to know what personal information we collect, use, and disclose; to request deletion or correction; to opt out of the sale or sharing of personal information; and to not be discriminated against for exercising these rights.</p>
        <ul><li>We collect the categories of information listed above (identifiers, commercial information, internet activity, and location data derived from IP address) for the business purposes described in this policy.</li><li>We do not sell personal information and do not share it for cross-context behavioral advertising.</li><li>To exercise your rights, email us using the contact details below. You may use an authorized agent, and we will verify your request.</li><li>California's &quot;Shine the Light&quot; law lets California residents ask which personal information we have disclosed to third parties for their direct marketing purposes. We do not make such disclosures.</li></ul>
      </section>

      <section id="children">
        <h2>11. Children's Privacy</h2>
        <p>The Site is intended for adults and businesses and is not directed to children under 18. We do not knowingly collect personal information from children. If you believe a child has provided us information, please contact us and we will delete it.</p>
      </section>

      <section id="international">
        <h2>12. International Visitors</h2>
        <p>We are based in the United States and the Site is operated from the United States. If you access it from elsewhere, your information will be transferred to, stored, and processed in the United States, where data protection laws may differ from those in your country.</p>
      </section>

      <section id="changes">
        <h2>13. Changes to This Policy</h2>
        <p>We may update this Privacy Policy from time to time. We will post the updated version on this page and revise the &quot;Last updated&quot; date. Please review it periodically.</p>
      </section>

      <section id="contact">
        <h2>14. Contact Us</h2>
        <p>For privacy questions or to exercise your rights, contact KONSTRUCTZ using the details below.</p>
        <p>KONSTRUCTZ<br>2522 S Malt Ave.<br>Commerce, CA 90040<br>United States<br>+1 213-214-2203<br><a href="mailto:sales@cwqv.com">sales@cwqv.com</a></p>
      </section>
